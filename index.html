<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Gestor de cuadrante V2</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f1f5f9; color:#0f172a; }
    main { width:min(680px,calc(100% - 32px)); padding:32px; background:white; border-radius:16px;
           box-shadow:0 8px 30px rgba(15,23,42,.10); text-align:center; }
    h1 { margin:0 0 10px; font-size:28px; }
    p { margin:8px 0; line-height:1.5; color:#475569; }
    .ok { display:inline-block; margin-top:18px; padding:10px 14px; border-radius:999px;
          background:#dcfce7; color:#166534; font-weight:600; }
    small { display:block; margin-top:24px; color:#64748b; }
  </style>
</head>
<body>
  <main>
    <h1>Gestor de cuadrante V2</h1>
    <p>La nueva aplicación se está preparando.</p>
    <span class="ok">V2 preparada para la primera prueba</span>
    <small>No hay datos personales ni credenciales almacenados en esta versión inicial.</small>
  </main>
</body>
</html>
